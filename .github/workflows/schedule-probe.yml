# Temporary: fetches De Anza's public schedule pages so the importer can be written against the real HTML.
# Results are committed to the `schedule-probe-results` branch. Safe to delete afterwards.
name: schedule-probe
on:
  push:
    branches: [schedule-probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sample sections (Banner 9)
        run: |
          mkdir -p out && cd out
          B="https://reg.oci.fhda.edu/StudentRegistrationSsb/ssb"
          UA="ClassPlannerV1 (student project; github.com/Loki200123/ClassPlannerV1)"
          SID="cp$(date +%s)"
          c() { curl -sS -A "$UA" -m 60 -c jar.txt -b jar.txt "$@"; }
          # 1) choose the term for this session (same request the class search page makes)
          c -o term.json -w "term-select %{http_code}\n" -X POST "$B/term/search?mode=search" \
            --data "term=202732&studyPath=&studyPathText=&startDatepicker=&endDatepicker=&uniqueSessionId=$SID" >> summary.txt
          sleep 2
          for SUBJ in MATH CIS; do
            c -o "w2027-$SUBJ.json" -w "$SUBJ %{http_code} %{size_download}b\n" \
              "$B/searchResults/searchResults?txt_subject=$SUBJ&txt_term=202732&pageOffset=0&pageMaxSize=500&sortColumn=subjectDescription&sortDirection=asc&uniqueSessionId=$SID" >> summary.txt
            sleep 2
            c -o /dev/null -X POST "$B/classSearch/resetDataForm" --data "uniqueSessionId=$SID"
            sleep 2
          done
          # whole term without a subject filter: how many sections, and does paging work?
          c -o "w2027-all-p0.json" -w "ALL %{http_code} %{size_download}b\n" \
            "$B/searchResults/searchResults?txt_term=202732&pageOffset=0&pageMaxSize=500&sortColumn=subjectDescription&sortDirection=asc&uniqueSessionId=$SID" >> summary.txt
          rm -f jar.txt
          for f in *.json; do printf "%s " "$f" >> summary.txt; python3 -c "import json,sys; d=json.load(open('$f')); print('success=',d.get('success'),'total=',d.get('totalCount'),'rows=',len(d.get('data') or []))" >> summary.txt 2>&1 || echo "not json" >> summary.txt; done
          cat summary.txt
      - name: Commit results to schedule-probe-results
        run: |
          cd out
          git init -q -b schedule-probe-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Schedule probe results"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" schedule-probe-results
