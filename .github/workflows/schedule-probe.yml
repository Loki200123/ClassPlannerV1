# Temporary: fetches De Anza's public schedule pages so the importer can be written against the real HTML.
# Results are committed to the `schedule-probe-results` branch. Safe to delete afterwards.
name: schedule-probe
on:
  push:
    branches: [schedule-probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe registration servers
        run: |
          mkdir -p out && cd out
          UA="ClassPlannerV1 (student project; github.com/Loki200123/ClassPlannerV1)"
          probe() {
            echo "== $1" >> summary.txt
            curl -sSL -A "$UA" -m 30 -c cookies.txt -b cookies.txt -D "$2.headers" -o "$2" -w "status %{http_code} type %{content_type} final %{url_effective}\n" "$1" >> summary.txt 2>&1 || echo "FAILED" >> summary.txt
            head -c 600 "$2" | tr '\n' ' ' >> summary.txt; echo >> summary.txt
            sleep 2
          }
          probe "https://banssb.fhda.edu/PROD/fhda_opencourses.P_Application" banner8.html
          probe "https://reg.oci.fhda.edu/StudentRegistrationSsb/ssb/classSearch/getTerms?searchTerm=&offset=1&max=10" b9-oci-terms.json
          probe "https://ssb-prod.ec.fhda.edu/StudentRegistrationSsb/ssb/classSearch/getTerms?searchTerm=&offset=1&max=10" b9-ec-terms.json
          probe "https://www.deanza.edu/schedule/" deanza.html
          cat summary.txt
      - name: Commit results to schedule-probe-results
        run: |
          cd out
          git init -q -b schedule-probe-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Schedule probe results"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" schedule-probe-results
